name: Close reviewed submissions

# Posts the verified publication replies. Runs only on this branch, then is removed.
on:
  push:
    branches:
      - cursor/publish-tool-submissions-5e53

permissions:
  contents: read
  issues: write

jobs:
  close:
    if: github.repository == 'korbinjoe/toools'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm live listings before closing
        run: |
          node <<'NODE'
          const checks = [
            { path: "/tools/chatgpt", status: 200, heading: "ChatGPT" },
            { path: "/tools/missing-xyz", status: 404 },
            { path: "/tools/mangatranslate", status: 200, heading: "MangaTranslate" },
            { path: "/tools/yap", status: 200, heading: "Yap" },
          ];
          function visible(html) {
            return html.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi, "").replace(/<style\b[^>]*>[\s\S]*?<\/style\s*>/gi, "");
          }
          for (const check of checks) {
            const response = await fetch(`https://toools.top${check.path}`, {
              headers: { Accept: "text/html" }, redirect: "error", cache: "no-store", signal: AbortSignal.timeout(30_000),
            });
            const body = visible(await response.text());
            const heading = body.match(/<h1\b[^>]*>([\s\S]*?)<\/h1\s*>/i)?.[1].replace(/<[^>]*>/g, "").trim();
            if (response.status !== check.status || /temporarily unavailable/i.test(body)) {
              throw new Error(`refusing to close; ${check.path} status=${response.status}`);
            }
            if (check.heading && heading !== check.heading) throw new Error(`refusing to close; ${check.path} heading mismatch`);
            console.log(`${check.path} status=${response.status} heading=${heading ?? "none"}`);
          }
          NODE

      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 9 --body "$(sed 's/^[[:space:]]*//' <<'EOF'
          The production listing is published and verified:

          https://toools.top/tools/mangatranslate

          Catalog reads were checked before the write. `/tools/chatgpt` returns the ChatGPT listing, and `/tools/missing-xyz` returns 404. The MangaTranslate page is HTTP 200 with the approved name, the Image & Media category, and the website link. It is not a 404 and does not show the temporarily unavailable state. The Image & Media category, search, and sitemap also include it.

          The listing data and publication script remain the ones committed in 940673b. Neon reads are working again.
          EOF
          )"
          gh issue close 9 --reason completed
          gh issue comment 12 --body "$(sed 's/^[[:space:]]*//' <<'EOF'
          Thanks for submitting Yap. We reviewed the public site on 2026-11-01 (homepage, download, pricing, Windows, Android, and the Mac offline page) and added it to the production catalog:

          https://toools.top/tools/yap

          - Category: Productivity
          - Pricing/platform: Paid / macOS, Windows, iOS, Android
          - Tags: AI, Writing, Audio

          Review notes, using the provider's pages rather than the submission text alone:

          - Pricing stays Paid. The site offers 3 days with a free account and no card, then a 10-day trial that requires a card, then USD 6.90 per month or USD 69 per year. There is no ongoing free plan.
          - iPhone and Android are included because the download and product pages document them, in addition to Mac and Windows.
          - The macOS 13+ line from the submission is not in the listing. The public pages require Apple Silicon (M1 and later) and say there is no Intel build; they do not state that version floor.
          - The Windows and Android pages say recognition uses NVIDIA's Parakeet model on the device. The Mac pages say recognition runs on the Mac and audio is not uploaded. The description keeps that distinction.
          - This is a documentation review, not a hands-on accuracy or speed test. Comparison and “fastest” claims were not recorded as measured results.
          - Disclosure noted: the issue says it was opened by the maker's AI operator.

          The live page is HTTP 200 with the Yap heading and website link. It is not a 404 and does not show the temporarily unavailable state. The Productivity category, search, and sitemap also include it. The repeatable publication script is in `scripts/approve-issue-12.sql`.
          EOF
          )"
          gh issue close 12 --reason completed
