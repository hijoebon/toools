name: Catalog smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Require the database credential without printing it
        env:
          CLOUD_DATABASE_TEMPLATE: ${{ secrets.CLOUD_DATABASE_TEMPLATE }}
          CLOUD_NEON_API_KEY: ${{ secrets.CLOUD_NEON_API_KEY }}
        run: |
          node <<'NODE'
          for (const name of ['CLOUD_DATABASE_TEMPLATE', 'CLOUD_NEON_API_KEY']) {
            console.log(`${name}=${process.env[name] ? 'present' : 'missing'}`);
          }
          if (!process.env.CLOUD_DATABASE_TEMPLATE) process.exit(1);
          NODE

      - name: Prove catalog reads without changing endpoint state or credentials
        env:
          DATABASE_URL: ${{ secrets.CLOUD_DATABASE_TEMPLATE }}
          CLOUD_NEON_API_KEY: ${{ secrets.CLOUD_NEON_API_KEY }}
        run: npm exec tsx scripts/catalog-smoke.ts
