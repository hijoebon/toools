name: Publish reviewed submissions

# One-shot operator path for the already reviewed issue #9 SQL and the issue #12
# SQL on this branch. It uses the existing catalog smoke and sql:publish scripts.
# Push to this branch runs it once; do not merge this workflow onto main.
on:
  push:
    branches:
      - cursor/publish-tool-submissions-5e53

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'korbinjoe/toools'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove catalog reads before publication
        env:
          DATABASE_URL: ${{ secrets.CLOUD_DATABASE_TEMPLATE }}
          CLOUD_NEON_API_KEY: ${{ secrets.CLOUD_NEON_API_KEY }}
          CATALOG_SMOKE_ENABLE_ENDPOINT: 'true'
        run: npm exec tsx scripts/catalog-smoke.ts

      - name: Publish MangaTranslate
        env:
          DATABASE_URL: ${{ secrets.CLOUD_DATABASE_TEMPLATE }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          CACHE_REVALIDATION_URL: https://toools.top/api/revalidate
        run: npm run sql:publish -- --file scripts/approve-issue-9.sql

      - name: Publish Yap
        env:
          DATABASE_URL: ${{ secrets.CLOUD_DATABASE_TEMPLATE }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          CACHE_REVALIDATION_URL: https://toools.top/api/revalidate
        run: npm run sql:publish -- --file scripts/approve-issue-12.sql

      - name: Verify live listings
        run: |
          node <<'NODE'
          const checks = [
            { path: "/tools/chatgpt", status: 200, heading: "ChatGPT" },
            { path: "/tools/missing-xyz", status: 404 },
            { path: "/tools/mangatranslate", status: 200, heading: "MangaTranslate" },
            { path: "/tools/yap", status: 200, heading: "Yap" },
          ];
          function visible(html) {
            return html.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi, "").replace(/<style\b[^>]*>[\s\S]*?<\/style\s*>/gi, "");
          }
          async function once() {
            for (const check of checks) {
              const response = await fetch(`https://toools.top${check.path}`, {
                headers: { Accept: "text/html" }, redirect: "error", cache: "no-store", signal: AbortSignal.timeout(30_000),
              });
              const body = visible(await response.text());
              const heading = body.match(/<h1\b[^>]*>([\s\S]*?)<\/h1\s*>/i)?.[1].replace(/<[^>]*>/g, "").trim();
              const unavailable = /temporarily unavailable/i.test(body);
              console.log(`${check.path} status=${response.status} heading=${heading ?? "none"} unavailable=${unavailable}`);
              if (response.status !== check.status || unavailable) return false;
              if (check.heading && heading !== check.heading) return false;
            }
            return true;
          }
          for (let attempt = 1; attempt <= 6; attempt++) {
            if (await once()) process.exit(0);
            if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          process.exit(1);
          NODE
